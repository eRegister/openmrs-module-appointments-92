# -------------------------------
# Workflow Name
# -------------------------------
# This name appears in the GitHub Actions tab of your repository.
name: Build and Release OMOD Artifacts

# -------------------------------
# Trigger Conditions
# -------------------------------
on:
  push:
    branches: [ main ]          # Automatically runs when code is pushed to the 'main' branch
  workflow_dispatch:            # Allows manual triggering from the GitHub Actions UI

# -------------------------------
# Job Definitions
# -------------------------------
jobs:
  build-and-release:            # The single job in this workflow
    runs-on: ubuntu-latest      # Runs the job on the latest Ubuntu virtual machine provided by GitHub
    
    steps:
    # -------------------------------
    # Step 1: Checkout source code
    # -------------------------------
    - name: Checkout source code
      uses: actions/checkout@v4 # Fetches your repository's code so other steps can access it
      
    # -------------------------------
    # Step 2: Setup Java and Maven
    # -------------------------------
    - name: Setup Java and Maven
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'    # Installs the Zulu (OpenJDK) distribution of Java
        java-version: '8'       # Sets the Java version to 8 (required by most OpenMRS modules)
        
    # -------------------------------
    # Step 3: Setup Maven via SDKMAN
    # -------------------------------
    - name: Setup Maven
      run: |
        # Installs SDKMAN (a tool to manage versions of Java, Maven, Gradle, etc.)
        curl -s "https://get.sdkman.io" | bash
        
        # Loads SDKMAN into the current shell session
        source "$HOME/.sdkman/bin/sdkman-init.sh"
        
        # Installs a specific version of Maven (3.6.3) to ensure consistency
        sdk install maven 3.6.3
        
    # -------------------------------
    # Step 4: Build API module
    # -------------------------------
    - name: Build API module
      run: |
        cd api/                   # Move into the API submodule directory
        mvn clean install -DskipTests  # Clean previous builds and compile the module, skipping tests
        
    # -------------------------------
    # Step 5: Build main module
    # -------------------------------
    - name: Build main module
      run: |
        mvn clean install -DskipTests  # Build the main module (which packages everything into the OMOD)
        
    # -------------------------------
    # Step 6: Upload built OMOD to release repository
    # -------------------------------
    - name: Upload to Release Repository
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}  # Pulls your GitHub Personal Access Token (PAT) from repository secrets
      run: |
        # -------------------------------------
        # 1. Clone the release repository
        # -------------------------------------
        # This is a separate repo that will only store built OMOD files.
        git clone https://$GH_TOKEN@github.com/petershale21/openmrs-module-appointments-92-release.git release-repo
        
        # -------------------------------------
        # 2. Clean out the old contents
        # -------------------------------------
        cd release-repo
        git rm -rf . || true      # Remove all tracked files
        git clean -fd || true     # Remove any untracked files and directories
        
        # -------------------------------------
        # 3. Copy the new OMOD build artifacts
        # -------------------------------------
        # Copies everything built under omod/target into the release repo
        cp -r ../omod/target/* . || true
        
        # -------------------------------------
        # 4. Commit and push changes
        # -------------------------------------
        git config user.name "GitHub Actions"   # Set commit author name
        git config user.email "actions@github.com"  # Set commit author email
        git add .                               # Stage all files
        git commit -m "Update OMOD artifacts: ${{ github.ref_name }}"  # Commit changes with branch name in message
        git push                                # Push to the release repository
